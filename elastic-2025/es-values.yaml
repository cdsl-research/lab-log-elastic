replicas: 3
minimumMasterNodes: 2
clusterHealthCheckParams: 'wait_for_status=yellow&timeout=10s'
persistence:
  ## @param persistence.enabled Enable persistence using Persistent Volume Claims
  ##
  enabled: true
  storageClass: "nfs-client"
  accessModes:
    - ReadWriteOnce
  dataSource: {}
volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
antiAffinity: "hard"
esJavaOpts: "-Xmx5g -Xms5g"
resources:
  requests:
    cpu: "1"
    memory: "6Gi"
  limits:
    cpu: "1"
    memory: "6Gi"
readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 60
  periodSeconds: 10
  successThreshold: 3
  timeoutSeconds: 5
protocol: http
httpPort: 9200
transportPort: 9300
service:
  type: NodePort
  ports:
    - port: 9200
      nodePort: 30092
    - port: 9300
      nodePort: 30093

# Secret Configuration
secret:
  create: true
  name: elasticsearch-master-credentials
  data:
    ELASTIC_PASSWORD: "***"
    ELASTIC_USERNAME: "***"
esConfig:
  elasticsearch.yml: |
      xpack.security.enabled: false
      xpack.security.audit.enabled: false
      xpack.security.transport.ssl.enabled: false
createCert: false
